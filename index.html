/* Mismo sistema visual que «Jujuy Mapa 3D» (contar-con-datos): fondo #050d17, paneles de vidrio oscuro, acentos teal, Inter. */
:root{
  --fondo:#050d17;
  --vidrio:rgba(7,17,29,.86);
  --borde:rgba(255,255,255,.12);
  --borde-suave:rgba(255,255,255,.10);
  --texto:#ffffff;
  --texto-2:#cbd5e1;   /* slate-300 */
  --texto-3:#94a3b8;   /* slate-400 */
  --texto-4:#64748b;   /* slate-500 */
  --teal:#5eead4;      /* teal-300 */
  --teal-2:#2dd4bf;    /* teal-400 */
  --teal-claro:#99f6e4;/* teal-200 */
  --teal-tinta:#04141c;
  --ambar:#f59e0b;
  --ambar-claro:#fcd34d;
  --rojo:#dc2626;
  --azul:#2563eb;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--fondo);color:var(--texto);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
svg{display:block}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--fondo);touch-action:none}
.nogl #gl{display:none}
.nogl body{background:var(--fondo) url(assets/paisaje.jpg) 50% 60%/cover no-repeat}
.velo{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,13,23,.55) 0,rgba(5,13,23,0) 22%,rgba(5,13,23,0) 60%,rgba(5,13,23,.55) 100%)}

.vidrio{background:var(--vidrio);border:1px solid var(--borde);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* encabezado como el del mapa */
.cabecera{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));

.cabecera .ic{width:20px;height:20px;color:var(--teal)}
.cabecera b{color:var(--teal);font-weight:800}
.mapa-link{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:700;color:var(--texto);text-decoration:none}
.mapa-link .ic{color:var(--ambar)}
.mapa-link:hover{border-color:rgba(94,234,212,.6)}

/* etiquetas sobre el paisaje (como los marcadores del mapa) */
.marca{position:fixed;z-index:4;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  transform:translate(-50%,-100%);transition:opacity .5s;opacity:0}
.marca.on{opacity:1}
.marca__txt{display:flex;flex-direction:column;align-items:center;padding:5px 9px;border-radius:8px;background:rgba(7,17,29,.88);border:1px solid rgba(255,255,255,.14);white-space:nowrap;line-height:1.2}
.marca__txt b{font-size:11px}
.marca__txt small{font-size:9.5px;color:var(--texto-3)}
.marca__punto{width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:var(--teal)}
.marca[data-tipo="jinetes"] .marca__punto{display:none}
.par{display:flex;gap:3px;padding:5px 6px;border-radius:999px;background:rgba(7,17,29,.9);border:1px solid rgba(253,230,138,.7);animation:pulso 1.8s ease-out infinite}
.par i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;transition:transform .3s,box-shadow .3s}
.par i.r{background:var(--rojo)} .par i.a{background:var(--azul)}
.marca[data-foco="rojo"] .par i.r,.marca[data-foco="azul"] .par i.a{transform:scale(1.45);box-shadow:0 0 10px 2px rgba(255,255,255,.7)}
.marca[data-tipo="jinetes"] .marca__txt{order:2;background:none;border:0;padding:0}
.marca[data-tipo="jinetes"] .marca__txt b{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fde68a;text-shadow:0 0 3px #020617,0 0 6px #020617}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}100%{box-shadow:0 0 0 16px rgba(245,158,11,0)}}

/* panel de la historia (igual que en el mapa) */
.panel{position:fixed;z-index:20;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:50vh;height:50svh;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.panel__top{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.04em}
.panel__top .t{font-weight:700;text-transform:uppercase;color:var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel__top .n{color:var(--texto-3);font-variant-numeric:tabular-nums}
.segs{padding:0 16px;display:flex;gap:4px}
.segs button{height:4px;flex:1;border-radius:999px;background:rgba(255,255,255,.15);transition:background .3s}
.segs button.on{background:var(--teal)}
.panel__body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}
.cap{display:flex;flex-direction:column;gap:12px}
.cap.entra{animation:entra .55s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{margin:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--teal)}
.cap h1,.cap h2{margin:0;font-size:24px;line-height:1.15;font-weight:700;text-wrap:balance}
.cap h1{font-size:28px;font-weight:800}
.lugar{margin:4px 0 0;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--texto-3)}

.cap p.txt{margin:0;font-size:14px;line-height:1.6;color:var(--texto-2)}
.vinetas{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;line-height:1.45;color:var(--texto-2)}
.vinetas li{display:flex;gap:8px}
.vinetas li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--ambar);margin-top:.5em}
.tarjeta{border:1px solid var(--borde);background:rgba(255,255,255,.03);border-radius:10px;padding:12px}
.tarjeta h3{margin:0;font-size:15px;font-weight:700;color:var(--teal-claro)}
.tarjeta p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--texto-2)}
.pregunta{margin:0;font-size:20px;font-weight:700;color:var(--ambar-claro)}
.credito{margin:0;font-size:12px;color:var(--texto-3)}
.portada{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--borde);background:#0b1a2a}
.portada img{width:100%;height:100%;object-fit:cover;display:block}
.contacto{display:grid;gap:8px}
.contacto a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--borde);background:rgba(255,255,255,.03);color:var(--texto);text-decoration:none;font-size:14px;min-height:44px;word-break:break-all}
.contacto a .ic{color:var(--teal)}
.contacto a:hover{border-color:rgba(94,234,212,.6)}
.contacto small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-3)}
.panel__nav{padding:10px 12px;border-top:1px solid var(--borde-suave);display:flex;align-items:center;gap:8px}
.btn{display:flex;align-items:center;gap:4px;padding:10px 12px;border-radius:10px;font-size:12px;min-height:40px}
.btn--sec{border:1px solid rgba(255,255,255,.15);color:var(--texto-2)}

.btn--pri{background:var(--teal-2);color:var(--teal-tinta);font-weight:700;padding-inline:16px}
.btn--pri:hover{background:var(--teal)}

.ayuda{flex:1;text-align:center;font-size:10px;color:var(--texto-4)}

/* intro */
.intro{position:fixed;z-index:30;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;

.intro__chip{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);padding:6px 10px;border-radius:999px}
.intro h1{margin:0;font-size:clamp(36px,11vw,64px);line-height:1;font-weight:800;text-align:center;letter-spacing:-.02em;text-wrap:balance}
.intro p{margin:0;color:var(--texto-2);text-align:center;font-size:15px}
.intro .btn--pri{font-size:14px;padding:14px 22px;min-height:48px}

@media (min-width:768px){
  .panel{left:16px;right:auto;top:calc(env(safe-area-inset-top,0px) + 72px);bottom:16px;height:auto;width:390px;border-radius:12px}

  .intro{justify-content:center;background:radial-gradient(ellipse at 50% 60%,rgba(5,13,23,.35),rgba(5,13,23,.88))}

@media (max-width:767px){.ayuda-d{display:none}}
@media (prefers-reduced-motion:reduce){.cap.entra,.par{animation:none}.intro{transition:none}}

function ir(k,sinVuelo){
  k=Math.max(0,Math.min(N-1,k)); if(k===idx) return;
  idx=k; var c=C[k];
  cuerpo.replaceChildren(render(c,k)); cuerpo.scrollTop=0;
  num.textContent=(k+1)+"/"+N;
  [].forEach.call(segs.children,function(b,j){b.classList.toggle("on",j<=k);});
  ant.disabled=k===0;
  sig.replaceChildren(); if(k===N-1){sig.appendChild(document.createTextNode("Volver al inicio"));}else{sig.appendChild(document.createTextNode("Siguiente "));sig.appendChild(icono("i-der"));}
  var h="#historia-"+(k+1); if(location.hash!==h) history.replaceState(null,"",h);
  volar(c,sinVuelo);
  var p=C[k+1]; if(p&&p.portada){var im=new Image();im.src="assets/portada.jpg";}
}
function empezar(k){intro.classList.add("fuera");panel.hidden=false;ir(k||0);setTimeout(function(){sig.focus({preventScroll:true});},50);}
document.getElementById("comenzar").onclick=function(){empezar(0);};
ant.onclick=function(){ir(idx-1);};
sig.onclick=function(){ if(idx===N-1){ idx=-1; panel.hidden=true; intro.classList.remove("fuera"); history.replaceState(null,"",location.pathname+location.search); volar(C[0]); } else ir(idx+1); };
window.addEventListener("keydown",function(e){
  if(panel.hidden){ if(e.key==="Enter"||e.key==="ArrowRight") empezar(0); return; }
  if(e.key==="ArrowRight") ir(idx+1); else if(e.key==="ArrowLeft") ir(idx-1);
});
/* deslizar a los costados (panel o paisaje) */
var t0=null;
document.addEventListener("touchstart",function(e){var t=e.touches[0];t0={x:t.clientX,y:t.clientY};},{passive:true});
document.addEventListener("touchend",function(e){
  if(!t0||panel.hidden) return; var t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y; t0=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4) ir(idx+(dx<0?1:-1));
},{passive:true});
window.addEventListener("hashchange",function(){var m=/^#historia-(\d+)$/.exec(location.hash);if(m){if(panel.hidden)empezar(+m[1]-1);else ir(+m[1]-1);}});

/* ---------------- Cámara (vuelo entre capítulos) ---------------- */
function E(c){return {u:c.cam.u,v:c.cam.v,z:c.cam.z,sx:(c.spot||[.5,.8])[0],sy:(c.spot||[.5,.8])[1],sk:c.spot?1:0,w:c.tinte||0,k:c.sombra||0};}
var cam=E(C[0]),desde=E(C[0]),hacia=E(C[0]),tVuelo=0,dur=1,pico=0;
function volar(c,inmediato){
  desde=JSON.parse(JSON.stringify(cam)); hacia=E(c); tVuelo=performance.now();
  var dist=Math.hypot(hacia.u-desde.u,hacia.v-desde.v);
  dur=(reducir||inmediato)?1:1900+dist*2600; pico=Math.min(.22,dist*.55);   // como flyTo: se aleja y vuelve a acercarse
  var j=document.getElementById("m-jinetes"); j.classList.toggle("on",!!c.jinetes); j.dataset.foco=c.foco||"";
}
function suave(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function paso(now){
  var k=Math.min(1,(now-tVuelo)/dur),e=suave(k);
  for(var key in hacia) cam[key]=desde[key]+(hacia[key]-desde[key])*e;
  cam.z=Math.min(.97,cam.z+pico*Math.sin(Math.PI*k));
}

/* ---------------- WebGL: paisaje con profundidad ---------------- */
var cv=document.getElementById("gl"),gl=null;
try{gl=cv.getContext("webgl",{antialias:false,alpha:false})||cv.getContext("experimental-webgl");}catch(e){}
var jin=document.getElementById("m-jinetes");
var IA=1920/1080,W=0,H=0,dpr=1;
function encuadre(){
  /* zona libre de la pantalla (fuera del panel) donde se centra el punto de interés */
  var w=innerWidth,h=innerHeight,movil=w<768,abierto=!panel.hidden;
  var fx=.5,fy=.5;
  var hueco=0,izq=0;                       /* parte de la pantalla tapada por el panel */
  if(abierto&&movil){hueco=1-(panel.getBoundingClientRect().top-8)/h;fy=(1-hueco)/2;}
  if(!abierto&&movil){hueco=.42;fy=.29;}           /* portada: el título ocupa la parte de abajo */
  if(abierto&&!movil){fx=(406+(w-406)/2)/w;izq=406/w;}
  /* z del capítulo = alto de la imagen que entra en la zona libre */
  var va=w/h,z=cam.z/(1-hueco),zx=z*va/IA,zmax=.97/(1-hueco);
  if(zx>.97){zx=.97;z=zx*IA/va;} if(z>zmax){z=zmax;zx=z*va/IA;}
  var cu=cam.u+(.5-fx)*zx, cv2=cam.v+(.5-fy)*z;
  /* el borde de la imagen puede quedar debajo del panel, nunca en la zona visible */
  cu=Math.min(1-zx/2-.01,Math.max(zx/2+.01-zx*izq,cu)); cv2=Math.min(1-z/2-.01+z*hueco,Math.max(z/2+.01,cv2));
  return {cu:cu,cv:cv2,zx:zx,z:z};
}
function ubicarJinetes(f){
  var x=((.503-f.cu)/f.zx+.5)*innerWidth, y=((.735-f.cv)/f.z+.5)*innerHeight;
  jin.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translate(-50%,-100%)";
}

var ptr={x:0,y:0},ptrT={x:0,y:0};
window.addEventListener("pointermove",function(e){ptrT.x=e.clientX/innerWidth-.5;ptrT.y=e.clientY/innerHeight-.5;},{passive:true});
window.addEventListener("deviceorientation",function(e){if(e.gamma==null)return;ptrT.x=Math.max(-.5,Math.min(.5,e.gamma/40));ptrT.y=Math.max(-.5,Math.min(.5,(e.beta-45)/50));},{passive:true});

if(!gl){
  root.classList.add("nogl");
  (function loop(now){paso(now);ubicarJinetes(encuadre());requestAnimationFrame(loop);})(performance.now());
}else{
  var VS="attribute vec2 a;varying vec2 s;void main(){s=a*.5+.5;gl_Position=vec4(a,0.,1.);}";
  var FS=["precision mediump float;varying vec2 s;",
   "uniform sampler2D T,D;uniform vec2 C,S,O;uniform float F,W,K;uniform vec3 SP;",
   "void main(){vec2 b=C+(s-.5)*S;vec2 p=b;",
   " for(int i=0;i<4;i++){float d=texture2D(D,p).r;p=b-O*(d-F);}",
   " float fuera=max(smoothstep(0.,-.04,b.y),smoothstep(0.,-.04,b.x));",
   " p=clamp(p,vec2(.001),vec2(.999));vec3 c=texture2D(T,p).rgb;float d=texture2D(D,p).r;",
   " c=mix(c,c*vec3(1.10,.96,.82)+vec3(.04,0.,-.02),W);",
   " c*=1.-K*(.55+.45*(1.-d));",
   " vec2 q=(p-SP.xy)*vec2(1.78,1.);float g=exp(-dot(q,q)/.0016);",
   " c=mix(c,c*(.70+.6*g)+vec3(.10,.07,.02)*g,SP.z);",
   " vec2 v=s-.5;c*=1.-dot(v,v)*.6;c=mix(c,vec3(.02,.05,.09),fuera);gl_FragColor=vec4(c,1.);}"].join("\n");
  var PV=["attribute vec3 a;uniform float TM,F;uniform vec2 O,R;varying float al;",
   "void main(){float dp=a.z;vec2 v=vec2(.012+.02*dp,.004*sin(TM*.3+a.x*20.));",
   " vec2 p=fract(a.xy+v*TM*.25);p+=-O*(dp-F)*2.6;p.y+=.02*sin(TM*.6+a.y*30.);",
   " gl_Position=vec4(p*2.-1.,0.,1.);gl_PointSize=(1.2+dp*3.6)*R.y/700.;al=(.16+.40*dp)*(.6+.4*sin(TM*1.3+a.x*50.));}"].join("\n");
  var PF="precision mediump float;varying float al;void main(){vec2 c=gl_PointCoord-.5;float r=dot(c,c);if(r>.25)discard;gl_FragColor=vec4(1.,.93,.78,al*(1.-r*4.));}";
  function sh(t,src){var o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
  function pr(v,f){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);return p;}
  var P1=pr(VS,FS),P2=pr(PV,PF);
  var q=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,q);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var NP=reducir?0:90,pts=new Float32Array(NP*3);for(var n=0;n<NP;n++){pts[n*3]=Math.random();pts[n*3+1]=Math.random();pts[n*3+2]=Math.pow(Math.random(),1.6);}
  var pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,pts,gl.STATIC_DRAW);
  function U(p,n){return gl.getUniformLocation(p,n);}
  var u1={T:U(P1,"T"),D:U(P1,"D"),C:U(P1,"C"),S:U(P1,"S"),O:U(P1,"O"),F:U(P1,"F"),W:U(P1,"W"),K:U(P1,"K"),SP:U(P1,"SP")},u2={TM:U(P2,"TM"),F:U(P2,"F"),O:U(P2,"O"),R:U(P2,"R")};
  var listas=0;
  function tex(unit,src){var t=gl.createTexture(),im=new Image();im.onload=function(){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
    [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(function(p){gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR);});
    [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(function(p){gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE);});listas++;};
    im.onerror=function(){root.classList.add("nogl");};im.src=src;}
  tex(0,"assets/paisaje.jpg");tex(1,"assets/profundidad.png");
  function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.round(innerWidth*dpr);H=Math.round(innerHeight*dpr);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}}
  addEventListener("resize",resize);resize();
  var T0=performance.now();
  (function frame(now){
    var tm=(now-T0)/1000; paso(now);
    ptr.x+=(ptrT.x-ptr.x)*.05; ptr.y+=(ptrT.y-ptr.y)*.05;
    var f=encuadre(); ubicarJinetes(f);
    if(listas>=2){
      var amp=reducir?0:1;
      var ox=(Math.sin(tm*.45)*.010+ptr.x*.024)*amp*f.zx, oy=(Math.cos(tm*.33)*.006-ptr.y*.012)*amp*f.z;
      var foco=.25+.6*Math.max(0,Math.min(1,(.97-cam.z)/.57));
      gl.viewport(0,0,W,H);gl.useProgram(P1);gl.bindBuffer(gl.ARRAY_BUFFER,q);
      var la=gl.getAttribLocation(P1,"a");gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
      gl.uniform1i(u1.T,0);gl.uniform1i(u1.D,1);gl.uniform2f(u1.C,f.cu,1-f.cv);gl.uniform2f(u1.S,f.zx,f.z);gl.uniform2f(u1.O,ox,oy);
      gl.uniform1f(u1.F,foco);gl.uniform1f(u1.W,cam.w);gl.uniform1f(u1.K,cam.k);gl.uniform3f(u1.SP,cam.sx,1-cam.sy,cam.sk);
      gl.disable(gl.BLEND);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.disableVertexAttribArray(la);
      if(NP){gl.useProgram(P2);gl.bindBuffer(gl.ARRAY_BUFFER,pb);var lb=gl.getAttribLocation(P2,"a");gl.enableVertexAttribArray(lb);gl.vertexAttribPointer(lb,3,gl.FLOAT,false,0,0);
        gl.uniform1f(u2.TM,tm);gl.uniform1f(u2.F,foco);gl.uniform2f(u2.O,ox/f.zx,oy/f.z);gl.uniform2f(u2.R,W,H);
        gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.drawArrays(gl.POINTS,0,NP);gl.disableVertexAttribArray(lb);}
    }
    requestAnimationFrame(frame);
  })(performance.now());
}

/* enlace directo: #historia-5 abre el capítulo 5 */
var m=/^#historia-(\d+)$/.exec(location.hash);
if(m) empezar(+m[1]-1); else volar(C[0],true);
})();
</script>
